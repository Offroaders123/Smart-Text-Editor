<!DOCTYPE html>
<html>

<head>

<title>Smart Text Editor</title>

<style>
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  height: 100%;
  font-family: Arial;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

header {
  padding: 10px 12px;
  gap: 8px;
  display: flex;
  background: #121212;
  box-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
  z-index: 1;

  button {
    padding: 3px 14px;
    color: #c0c0c0;
    font-size: 14px;
    font-family: inherit;
    background: #4a4a4a;
    border: 0;
    border-radius: 4px;
  }
}

main {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: auto;
}

#userInput {
  padding: 6px 12px;
  height: 50%;
  color: white;
  font-size: 13px;
  font-family: ui-monospace, "Noto Sans Mono", "Cousine", monospace;
  background: #222222;
  border: 0;
  resize: none;

  &::placeholder {
    color: inherit;
    opacity: 0.55;
    white-space: pre-wrap;
  }
}

#preview {
  height: 50%;
  border: 0;
  border-top: 14px solid #4a4a4a;
}
</style>

</head>

<body>

<header>
  <button id="openFile">Open</button>
  <button id="saveFile">Save</button>
</header>

<main>
  <textarea id="userInput" placeholder="Welcome to Smart Text Editor! This site was made to allow for coding within the browser." spellcheck="false"></textarea>
  <iframe id="preview" src="about:blank"></iframe>
</main>

<script type="module">
// library
const createSignal = value => {
  const effects = [];
  const pushEffect = callback => {
    effects.push(callback);
    callback(value);
  };
  const effect = value => {
    for (const callback of effects) {
      callback(value);
    }
  };
  const get = () => value;
  const set = newValue => {
    if (newValue === value) return;
    value = newValue;
    effect(value);
  };
  return [get, set, pushEffect];
};

// app
const [getName, setName] = createSignal("Untitled.txt");
const [getValue, setValue, onValue] = createSignal("");
const [getHandle, setHandle, onHandle] = createSignal(null);

onHandle(async handle => {
  if (handle === null) return;
  const file = await handle.getFile();
  const { name } = file;
  const text = await file.text();
  setName(name);
  setValue(text);
});

// header
openFile.addEventListener("click", async () => {
  if ("showOpenFilePicker" in window) {
    const [handle] = await showOpenFilePicker();
    setHandle(handle);
  } else {
    const input = document.createElement("input");
    input.type = "file";
    input.addEventListener("change", async event => {
      if (event.currentTarget.files.length < 1) return;
      const [file] = event.currentTarget.files;
      const { name } = file;
      const text = await file.text();
      setName(name);
      setValue(text);
    }, { once: true });
    input.click();
  }
});

saveFile.addEventListener("click", () => {
  const blob = new Blob([getValue()], { type: "text/plain" });
  const anchor = document.createElement("a");
  anchor.download = getName();
  anchor.href = URL.createObjectURL(blob);
  anchor.click();
});

// userInput
onValue(value => {
  if (userInput.value === value) return;
  userInput.value = value;
  userInput.setSelectionRange(0, 0);
});
userInput.addEventListener("input", event => setValue(event.currentTarget.value));

// preview
onValue(value => {
  preview.contentDocument.open();
  preview.contentDocument.write(value);
  preview.contentDocument.close();
});
</script>

</body>

</html>
